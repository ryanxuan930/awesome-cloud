<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ryan's Awesome Cloud</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light dark;--bg:#f5f5f4;--fg:#1c1917;--mut:#78716c;--card:#fff;--line:#d6d3d1;--acc:#1c1917;--accfg:#fff;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#f5f5f4;--mut:#a8a29e;--card:#1f1e1d;--line:#3a3836;--acc:#f5f5f4;--accfg:#141413;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:20px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{width:min(92vw,520px);padding:24px 0}
h1{font-size:28px;font-weight:700;margin:0 0 28px;text-align:center;letter-spacing:.01em}
form{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:24px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);-webkit-text-security:disc}
input:focus{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
form button{font-size:22px;padding:0 26px}
#msg{min-height:1.5em;margin:14px 2px 0;color:var(--mut);font-size:17px;text-align:center}
#msg.err{color:var(--err)}
#files{display:grid;gap:14px}
.dl{display:block;width:100%;padding:26px 20px;font-size:32px;text-align:center}
.dl small{display:block;margin-top:4px;font-size:15px;font-weight:400;opacity:.7}
.row{display:grid;gap:8px}
.alt{background:transparent;color:var(--mut);font-size:16px;font-weight:400;padding:6px;text-decoration:underline}
.all{background:var(--card);color:var(--fg);border:1.5px solid var(--line);font-size:20px;padding:14px}
</style>
</head>
<body>
<main>
  <h1>Ryan's Awesome Cloud</h1>
  <form id="gate" autocomplete="off">
    <input id="pw" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="密碼" aria-label="密碼" autofocus>
    <button id="go" type="submit">解鎖</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <section id="files" hidden></section>
</main>
<script>
(() => {
  // 一定要 https（Web Crypto 只在安全環境可用）；localhost 測試除外
  if (location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
    location.replace('https:' + location.href.slice(5));
    return;
  }
  const $ = (id) => document.getElementById(id);
  const msg = (t, err) => { $('msg').textContent = t || ''; $('msg').className = err ? 'err' : ''; };
  // 用 type=text + CSS 遮罩，避免瀏覽器在別人的電腦跳出「儲存密碼？」；不支援遮罩的瀏覽器改回 password
  if (!(window.CSS && CSS.supports('-webkit-text-security', 'disc'))) $('pw').type = 'password';
  if (!window.crypto || !crypto.subtle) { msg('此瀏覽器不支援解密，請改用新版 Chrome / Edge / Safari', true); $('go').disabled = true; }

  // 與 build.mjs 相同的密碼正規化：全形→半形、去空白、轉小寫
  const norm = (s) => s.normalize('NFKC').trim().toLowerCase();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const mb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  const label = (n) => {
    const e = n.split('.').pop().toLowerCase();
    return e === 'pptx' || e === 'ppt' ? '下載 PPT' : e === 'pdf' ? '下載 PDF' : '下載 ' + n;
  };
  const get = async (url, type) => {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    return type === 'json' ? r.json() : new Uint8Array(await r.arrayBuffer());
  };

  async function unlock(pw) {
    const meta = await get('meta.json', 'json');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const out = [];
    for (const f of meta.files) {
      const buf = await get(f.enc, 'bin');
      let plain;
      try {
        plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
      } catch { const e = new Error('bad password'); e.bad = true; throw e; } // GCM 驗證失敗 = 密碼錯
      out.push({ ...f, url: URL.createObjectURL(new Blob([plain], { type: f.mime })) });
    }
    return out;
  }

  function save(f) {
    const a = document.createElement('a');
    a.href = f.url; a.download = f.name;
    document.body.append(a); a.click(); a.remove();
  }

  function render(files) {
    $('gate').hidden = true; msg('');
    const box = $('files'); box.hidden = false; box.replaceChildren();
    for (const f of files) {
      const row = document.createElement('div'); row.className = 'row';
      const b = document.createElement('button'); b.className = 'dl'; b.textContent = label(f.name);
      const s = document.createElement('small'); s.textContent = f.name + ' · ' + mb(f.size); b.append(s);
      b.onclick = () => save(f);
      row.append(b);
      if (f.mime === 'application/pdf') {
        const o = document.createElement('button'); o.className = 'alt'; o.textContent = '在瀏覽器直接開啟';
        o.onclick = () => window.open(f.url, '_blank');
        row.append(o);
      }
      box.append(row);
    }
    if (files.length > 1) {
      const all = document.createElement('button'); all.className = 'all'; all.textContent = '全部下載';
      all.onclick = () => files.forEach((f, i) => setTimeout(() => save(f), i * 500));
      box.append(all);
    }
  }

  $('gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = norm($('pw').value);
    if (!pw) return;
    $('go').disabled = true; msg('解鎖中…');
    try {
      render(await unlock(pw));
    } catch (err) {
      msg(err.bad ? '密碼錯誤' : '讀取失敗，請確認網路後再試一次', true);
      $('pw').select();
    } finally { $('go').disabled = false; }
  });
})();
</script>
</body>
</html>
